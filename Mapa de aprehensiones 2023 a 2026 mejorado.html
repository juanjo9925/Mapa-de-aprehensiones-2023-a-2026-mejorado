<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Aprehensiones · Impuesto al Consumo</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<style>
:root{
  --navy:#0B2545;
  --navy-soft:#13335c;
  --paper:#F5F6F5;
  --ink:#1C2430;
  --ink-soft:#5B6472;
  --line:#DDE1E6;
  --gold:#B8892B;
  --card:#FFFFFF;

  --c-cerveza:#8B5E34;
  --c-cigarrillo:#C1443B;
  --c-licor:#2E5AAC;
  --c-estampilla:#3D8361;
  --c-otros:#8A8F98;
  --c-top:#7A4E8C;

  --verde-claro:#D7F2D2;
  --verde-medio:#5FAE5C;
  --verde-oscuro:#0B4F1E;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;}

#app{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:360px;min-width:360px;background:var(--card);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow-y:auto;
}
#sidebar::-webkit-scrollbar{width:8px;}
#sidebar::-webkit-scrollbar-thumb{background:#c7ccd2;border-radius:4px;}

.brand{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-soft) 100%);
  color:#fff;padding:22px 20px 18px;
}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:6px;}
.brand h1{font-size:20px;line-height:1.25;margin:0 0 4px;font-weight:700;}
.brand p{font-size:12.5px;opacity:.85;margin:0;}

.panel{padding:16px 20px;border-bottom:1px solid var(--line);}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 12px;font-family:inherit;font-weight:700;}

/* indicadores */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.stat .num{font-size:18px;font-weight:700;color:var(--navy);font-family:Georgia,serif;}
.stat .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}

/* filtro año */
.year-row{display:flex;gap:6px;flex-wrap:wrap;}
.year-chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;
  padding:6px 14px;font-size:13px;cursor:pointer;user-select:none;
  transition:.15s;color:var(--ink-soft);
}
.year-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}

/* capas */
.layer-item{
  display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;cursor:pointer;
}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.layer-item .count{margin-left:auto;font-size:11.5px;color:var(--ink-soft);background:var(--paper);padding:1px 7px;border-radius:10px;}
.layer-item input{accent-color:var(--navy);width:15px;height:15px;cursor:pointer;}
.layer-item.disabled{opacity:.4;}

/* buscador */
#buscador{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;background:var(--paper);
}
#buscador:focus{outline:2px solid var(--navy);outline-offset:1px;background:#fff;}
#resultados-busqueda{max-height:140px;overflow-y:auto;margin-top:8px;}
.resultado-item{padding:7px 8px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink-soft);}
.resultado-item:hover{background:var(--paper);color:var(--ink);}

/* botones */
.btn{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--navy);
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  transition:.15s;
}
.btn:hover{background:var(--navy-soft);}
.btn.secundario{background:#fff;color:var(--navy);}
.btn.secundario:hover{background:var(--paper);}

canvas#chartCategorias{max-height:170px;}

.nota{font-size:11px;color:var(--ink-soft);line-height:1.5;background:#FBF6E9;border:1px solid #EEDFB6;border-radius:8px;padding:9px 10px;margin-top:10px;}

/* ---------- MAPA ---------- */
#mapa-wrap{flex:1;position:relative;}
#mapa{height:100%;width:100%;}

.leyenda-mapa{
  background:rgba(255,255,255,.96);border-radius:10px;padding:10px 12px;
  font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);line-height:1.6;
  border:1px solid var(--line);
}
.leyenda-mapa h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.leyenda-fila{display:flex;align-items:center;gap:7px;}
.leyenda-barra{width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--verde-claro),var(--verde-medio),var(--verde-oscuro));margin:4px 0;}
.leyenda-escala{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);}

.popup-titulo{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--navy);}
.popup-fila{font-size:12.5px;margin:1px 0;}
.popup-fila b{color:var(--ink-soft);font-weight:600;}

@media (max-width:820px){
  #sidebar{position:absolute;z-index:1000;height:100%;box-shadow:0 0 20px rgba(0,0,0,.25);transform:translateX(-100%);transition:.2s;}
  #sidebar.abierto{transform:translateX(0);}
  #btn-toggle-sidebar{display:flex !important;}
}
#btn-toggle-sidebar{
  display:none;position:absolute;top:12px;left:12px;z-index:1001;
  width:38px;height:38px;background:var(--navy);color:#fff;border-radius:8px;
  align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);
}
</style>
</head>
<body>

<div id="app">
  <div id="btn-toggle-sidebar">☰</div>

  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">Subdirección de Fiscalización · Secretaría de Hacienda</div>
      <h1>Mapa de Aprehensiones — Impuesto al Consumo</h1>
      <p>Licores, cervezas, cigarrillos y estampillas · 2023–2026</p>
    </div>

    <div class="panel">
      <h2>Indicadores</h2>
      <div class="stats-grid" id="stats-grid"></div>
    </div>

    <div class="panel">
      <h2>Vigencia</h2>
      <div class="year-row" id="year-row"></div>
    </div>

    <div class="panel">
      <h2>Capas del mapa</h2>
      <div id="layers-list"></div>
    </div>

    <div class="panel">
      <h2>Buscar municipio o dirección</h2>
      <input id="buscador" type="text" placeholder="Ej: Girardot, Fusagasugá, Calle 26...">
      <div id="resultados-busqueda"></div>
    </div>

    <div class="panel">
      <h2>Valor comercial por categoría (según filtro actual)</h2>
      <canvas id="chartCategorias"></canvas>
    </div>

    <div class="panel">
      <h2>Exportar</h2>
      <button class="btn" id="btn-exportar">Descargar datos filtrados (CSV)</button>
      <div class="nota" id="nota-pendientes"></div>
    </div>
  </aside>

  <div id="mapa-wrap">
    <div id="mapa"></div>
  </div>
</div>

// georreferenciados). El punto "resumen" por ubicación se calcula en
// vivo a partir de `registros`, respetando el filtro de año activo, en
// vez de depender de un agregado pre-calculado que quedaría desfasado.
// =====================================================================

const REGISTROS = JSON.parse(document.getElementById('datos-individuales').textContent);
const META = JSON.parse(document.getElementById('datos-meta').textContent);

const CATEGORIAS = [
  { key: 'Cervezas',    color: 'var(--c-cerveza)',    hex: '#8B5E34', emoji: '🍺' },
  { key: 'Cigarrillos', color: 'var(--c-cigarrillo)', hex: '#C1443B', emoji: '🚬' },
  { key: 'Licores',     color: 'var(--c-licor)',      hex: '#2E5AAC', emoji: '🥃' },
  { key: 'Estampillas', color: 'var(--c-estampilla)', hex: '#3D8361', emoji: '🧾' },
  { key: 'Otros',       color: 'var(--c-otros)',      hex: '#8A8F98', emoji: '📦' },
];
const ANIOS = META.anios; // p.ej. [2023,2024,2025,2026]

const fmtCOP = (v) => '$' + Math.round(v || 0).toLocaleString('es-CO');
const fmtNum = (v) => Math.round(v || 0).toLocaleString('es-CO');

// Estado de filtros
// ---------------------------------------------------------------------
const estado = {
  anios: new Set(ANIOS),
  capasVisibles: {
    Cervezas: true, Cigarrillos: true, Licores: true, Estampillas: true,

};

// Mapa base
// ---------------------------------------------------------------------
const mapa = L.map('mapa', { zoomControl: true }).setView([4.55, -74.35], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(mapa);

const gruposCategoria = {}; // categoria -> L.markerClusterGroup

  gruposCategoria[c.key] = L.markerClusterGroup({
    disableClusteringAtZoom: 15,
    maxClusterRadius: 45,
    iconCreateFunction: (cluster) => L.divIcon({
      html: `<div style="background:${c.hex};color:#fff;border-radius:50%;width:34px;height:34px;

  });
});

function popupIndividual(r) {

  }[r.PRECISION_GEOCODIFICACION] || r.PRECISION_GEOCODIFICACION || 'N/D';
  return `
    <div class="popup-titulo">${r.DIRECCION_MOSTRAR || r.MUNICIPIO_LIMPIO}</div>

    <div class="popup-fila"><b>Precisión:</b> ${precisionEtiqueta}</div>
  `;
}

    <div class="popup-titulo">${g.direccion}</div>
    <div class="popup-fila">🍺 <b>Cervezas:</b> ${fmtNum(g.cant.Cervezas)} u. · ${fmtCOP(g.val.Cervezas)}</div>
    <div class="popup-fila">🚬 <b>Cigarrillos:</b> ${fmtNum(g.cant.Cigarrillos)} u. · ${fmtCOP(g.val.Cigarrillos)}</div>
    <div class="popup-fila">🥃 <b>Licores:</b> ${fmtNum(g.cant.Licores)} u. · ${fmtCOP(g.val.Licores)}</div>
    <div class="popup-fila">🧾 <b>Estampillas:</b> ${fmtNum(g.cant.Estampillas)} u. · ${fmtCOP(g.val.Estampillas)}</div>
    <hr style="border:none;border-top:1px solid #eee;margin:6px 0;">
    <div class="popup-fila"><b>Cantidad total:</b> ${fmtNum(g.totalCantidad)}</div>
    <div class="popup-fila"><b>💰 Valor comercial total:</b> ${fmtCOP(g.totalValor)}</div>
  `;
}

// ---------------------------------------------------------------------
// Escala de verdes para el punto resumen
// ---------------------------------------------------------------------
function interpolarColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), b2 = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${b2})`;
}
function colorVerde(valor, min, max) {
  if (max <= min) return interpolarColor('#D7F2D2', '#0B4F1E', 0.5);
  const t = Math.max(0, Math.min(1, (valor - min) / (max - min)));
  if (t < 0.5) return interpolarColor('#D7F2D2', '#5FAE5C', t / 0.5);
  return interpolarColor('#5FAE5C', '#0B4F1E', (t - 0.5) / 0.5);
}

// ---------------------------------------------------------------------
// Reconstrucción de capas según filtros activos
// ---------------------------------------------------------------------
function reconstruirCapas() {
  Object.values(gruposCategoria).forEach(g => g.clearLayers());
  grupoTop.clearLayers();
  grupoResumen.clearLayers();
  if (capaCalor) { mapa.removeLayer(capaCalor); capaCalor = null; }

  const filtrados = REGISTROS.filter(r => estado.anios.has(r.PERIODO));

  // --- puntos individuales por categoría + top ---
  const puntosCalor = [];
  filtrados.forEach(r => {
    const cat = CATEGORIAS.find(c => c.key === r.CATEGORIA) || CATEGORIAS[4];
    const marker = L.circleMarker([r.LATITUD, r.LONGITUD], {
      radius: r.ES_TOP ? 7 : 5,
      color: r.ES_TOP ? '#7A4E8C' : cat.hex,
      fillColor: r.ES_TOP ? '#7A4E8C' : cat.hex,
      fillOpacity: r.ES_TOP ? 1 : 0.75,
      weight: 1,
    }).bindPopup(popupIndividual(r));

    if (r.ES_TOP) {
      grupoTop.addLayer(marker);
    } else {
      gruposCategoria[cat.key].addLayer(marker);
    }
    puntosCalor.push([r.LATITUD, r.LONGITUD, Math.min(r.VLR_COMERCIAL / 200000, 5)]);
  });

  // --- punto resumen (agregado en vivo por ubicación, según años activos) ---
  const porUbicacion = new Map();
  filtrados.forEach(r => {
    const key = r.LATITUD + '|' + r.LONGITUD;
    if (!porUbicacion.has(key)) {
      porUbicacion.set(key, {
        lat: r.LATITUD, lon: r.LONGITUD, direccion: r.DIRECCION_MOSTRAR || r.MUNICIPIO_LIMPIO,
        cant: { Cervezas: 0, Cigarrillos: 0, Licores: 0, Estampillas: 0, Otros: 0 },
        val: { Cervezas: 0, Cigarrillos: 0, Licores: 0, Estampillas: 0, Otros: 0 },
        totalCantidad: 0, totalValor: 0,
      });
    }
    const g = porUbicacion.get(key);
    g.cant[r.CATEGORIA] = (g.cant[r.CATEGORIA] || 0) + r.CANTIDAD;
    g.val[r.CATEGORIA] = (g.val[r.CATEGORIA] || 0) + r.VLR_COMERCIAL;
    g.totalCantidad += r.CANTIDAD;
    g.totalValor += r.VLR_COMERCIAL;
  });
  const ubicaciones = Array.from(porUbicacion.values());
  const valores = ubicaciones.map(u => u.totalValor);
  const minV = Math.min(...valores, 0), maxV = Math.max(...valores, 1);

  ubicaciones.forEach(u => {
    const radio = 5 + 11 * (Math.log1p(u.totalValor) / Math.log1p(maxV || 1));
    const marker = L.circleMarker([u.lat, u.lon], {
      radius: radio,
      color: colorVerde(u.totalValor, minV, maxV),
      fillColor: colorVerde(u.totalValor, minV, maxV),
      fillOpacity: 0.85,
      weight: 1,
    }).bindPopup(popupResumen(u));
    grupoResumen.addLayer(marker);
  });

  // --- capa de calor ---
  if (puntosCalor.length) {
    capaCalor = L.heatLayer(puntosCalor, { radius: 22, blur: 18, maxZoom: 14 });
  }

  aplicarVisibilidadCapas();
  actualizarIndicadores(filtrados, ubicaciones);
  actualizarGrafica(filtrados);
  window._ultimoFiltrado = filtrados; // para exportar
}

function aplicarVisibilidadCapas() {
  Object.entries(gruposCategoria).forEach(([key, grupo]) => {
    if (estado.capasVisibles[key]) { if (!mapa.hasLayer(grupo)) grupo.addTo(mapa); }
    else { if (mapa.hasLayer(grupo)) mapa.removeLayer(grupo); }
  });
  if (estado.capasVisibles.Top) { if (!mapa.hasLayer(grupoTop)) grupoTop.addTo(mapa); }
  else if (mapa.hasLayer(grupoTop)) mapa.removeLayer(grupoTop);

  if (estado.capasVisibles.Resumen) { if (!mapa.hasLayer(grupoResumen)) grupoResumen.addTo(mapa); }
  else if (mapa.hasLayer(grupoResumen)) mapa.removeLayer(grupoResumen);

  if (estado.capasVisibles.Calor && capaCalor) { capaCalor.addTo(mapa); }
}

// ---------------------------------------------------------------------
// Indicadores
// ---------------------------------------------------------------------
function actualizarIndicadores(filtrados, ubicaciones) {
  const totalValor = filtrados.reduce((s, r) => s + (r.VLR_COMERCIAL || 0), 0);
  const totalCantidad = filtrados.reduce((s, r) => s + (r.CANTIDAD || 0), 0);
  const stats = [
    { num: fmtNum(filtrados.length), lbl: 'Registros en el filtro actual' },
    { num: fmtNum(ubicaciones.length), lbl: 'Ubicaciones georreferenciadas' },
    { num: fmtCOP(totalValor), lbl: 'Valor comercial total' },
    { num: fmtNum(totalCantidad), lbl: 'Unidades aprehendidas' },
  ];
  document.getElementById('stats-grid').innerHTML = stats.map(s =>
    `<div class="stat"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
  ).join('');
}

// ---------------------------------------------------------------------
// Gráfica lateral (Chart.js) — valor por categoría bajo el filtro actual
// ---------------------------------------------------------------------
let chart = null;
function actualizarGrafica(filtrados) {
  const porCategoria = {};
  CATEGORIAS.forEach(c => porCategoria[c.key] = 0);
  filtrados.forEach(r => { porCategoria[r.CATEGORIA] = (porCategoria[r.CATEGORIA] || 0) + r.VLR_COMERCIAL; });

  const ctx = document.getElementById('chartCategorias').getContext('2d');
  const data = {
    labels: CATEGORIAS.map(c => c.emoji + ' ' + c.key),
    datasets: [{ data: CATEGORIAS.map(c => porCategoria[c.key]), backgroundColor: CATEGORIAS.map(c => c.hex) }],
  };
  if (chart) { chart.data = data; chart.update(); return; }
  chart = new Chart(ctx, {
    type: 'bar',
    data,
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmtCOP(ctx.raw) } } },
      scales: { x: { ticks: { callback: (v) => '$' + (v / 1e6).toFixed(0) + 'M' } } },
      responsive: true, maintainAspectRatio: false,
    },
  });
}

// ---------------------------------------------------------------------
// Panel de filtros: años
// ---------------------------------------------------------------------
function pintarFiltroAnios() {
  document.getElementById('year-row').innerHTML = ANIOS.map(a =>
    `<div class="year-chip ${estado.anios.has(a) ? 'active' : ''}" data-anio="${a}">${a}</div>`
  ).join('');
  document.querySelectorAll('.year-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const a = parseInt(chip.dataset.anio, 10);
      if (estado.anios.has(a)) estado.anios.delete(a); else estado.anios.add(a);
      pintarFiltroAnios();
      reconstruirCapas();
    });
  });
}

// ---------------------------------------------------------------------
// Panel de capas
// ---------------------------------------------------------------------
function pintarFiltroCapas() {
  const conteos = {};
  CATEGORIAS.forEach(c => conteos[c.key] = REGISTROS.filter(r => r.CATEGORIA === c.key && !r.ES_TOP).length);
  const conteoTop = REGISTROS.filter(r => r.ES_TOP).length;

  const filas = [
    ...CATEGORIAS.map(c => ({ key: c.key, label: c.key, color: c.hex, count: conteos[c.key] })),
    { key: 'Top', label: 'Top de grandes aprehensiones', color: '#7A4E8C', count: conteoTop },
    { key: 'Resumen', label: 'Resumen consolidado (verde)', color: '#5FAE5C', count: null },
    { key: 'Calor', label: 'Mapa de calor', color: '#E4572E', count: null },
  ];

  document.getElementById('layers-list').innerHTML = filas.map(f => `
    <label class="layer-item">
      <input type="checkbox" data-layer="${f.key}" ${estado.capasVisibles[f.key] ? 'checked' : ''}>
      <span class="dot" style="background:${f.color}"></span>
      <span>${f.label}</span>
      ${f.count !== null ? `<span class="count">${f.count}</span>` : ''}
    </label>
  `).join('');

  document.querySelectorAll('[data-layer]').forEach(chk => {
    chk.addEventListener('change', () => {
      estado.capasVisibles[chk.dataset.layer] = chk.checked;
      aplicarVisibilidadCapas();
    });
  });
}

// ---------------------------------------------------------------------
// Buscador
// ---------------------------------------------------------------------
document.getElementById('buscador').addEventListener('input', (e) => {
  const q = e.target.value.trim().toUpperCase();
  const cont = document.getElementById('resultados-busqueda');
  if (q.length < 2) { cont.innerHTML = ''; return; }
  const coincidencias = new Map();
  REGISTROS.forEach(r => {
    const texto = `${r.DIRECCION_MOSTRAR} ${r.MUNICIPIO_LIMPIO}`.toUpperCase();
    if (texto.includes(q)) {
      const key = r.LATITUD + '|' + r.LONGITUD;
      if (!coincidencias.has(key)) coincidencias.set(key, r);
    }
  });
  const items = Array.from(coincidencias.values()).slice(0, 8);
  cont.innerHTML = items.map(r =>
    `<div class="resultado-item" data-lat="${r.LATITUD}" data-lon="${r.LONGITUD}">${r.DIRECCION_MOSTRAR || r.MUNICIPIO_LIMPIO} — ${r.MUNICIPIO_LIMPIO}</div>`
  ).join('') || '<div class="resultado-item">Sin coincidencias</div>';

  cont.querySelectorAll('.resultado-item[data-lat]').forEach(el => {
    el.addEventListener('click', () => {
      mapa.setView([parseFloat(el.dataset.lat), parseFloat(el.dataset.lon)], 16);
    });
  });
});

// ---------------------------------------------------------------------
// Exportar CSV del filtro actual
// ---------------------------------------------------------------------
document.getElementById('btn-exportar').addEventListener('click', () => {
  const filas = window._ultimoFiltrado || [];
  const encabezado = ['Direccion', 'Municipio', 'Categoria', 'Clase', 'Cantidad', 'Valor_Comercial', 'Periodo', 'Cierre_Establecimiento', 'Latitud', 'Longitud'];
  const lineas = [encabezado.join(';')];
  filas.forEach(r => {
    lineas.push([
      (r.DIRECCION_MOSTRAR || '').replaceAll(';', ','),
      (r.MUNICIPIO_LIMPIO || '').replaceAll(';', ','),
      r.CATEGORIA, (r.CLASE || '').replaceAll(';', ','), r.CANTIDAD, r.VLR_COMERCIAL, r.PERIODO,
      r.CIERRE_ESTABLECIMIENTO, r.LATITUD, r.LONGITUD,
    ].join(';'));
  });
  const blob = new Blob(['\uFEFF' + lineas.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'aprehensiones_filtradas.csv'; a.click();
  URL.revokeObjectURL(url);
});

// ---------------------------------------------------------------------
// Leyendas del mapa
// ---------------------------------------------------------------------
const leyendaTipo = L.control({ position: 'bottomright' });
leyendaTipo.onAdd = () => {
  const div = L.DomUtil.create('div', 'leyenda-mapa');
  div.innerHTML = `
    <h4>Tipo de producto</h4>
    ${CATEGORIAS.map(c => `<div class="leyenda-fila"><span class="dot" style="background:${c.hex}"></span>${c.emoji} ${c.key}</div>`).join('')}
    <div class="leyenda-fila"><span class="dot" style="background:#7A4E8C"></span>⭐ Top de aprehensiones</div>
  `;
  return div;
};
leyendaTipo.addTo(mapa);

const leyendaValor = L.control({ position: 'bottomleft' });
leyendaValor.onAdd = () => {
  const div = L.DomUtil.create('div', 'leyenda-mapa');
  div.innerHTML = `
    <h4>Resumen · Valor comercial total</h4>
    <div class="leyenda-barra"></div>
    <div class="leyenda-escala"><span>Menor</span><span>Mayor</span></div>
  `;
  return div;
};
leyendaValor.addTo(mapa);

// ---------------------------------------------------------------------
// Sidebar móvil
// ---------------------------------------------------------------------
document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('abierto');
});

// ---------------------------------------------------------------------
// Nota de pendientes
// ---------------------------------------------------------------------
document.getElementById('nota-pendientes').innerHTML = (() => {
  const c = META.conteo_por_precision || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0) || 1;
  const fila = (k, emoji) => c[k] ? `${emoji} <b>${k}:</b> ${c[k]} (${(100 * c[k] / total).toFixed(1)}%)<br>` : '';
  return `<b>${META.pct_georreferenciado_global ?? 100}% de los registros quedaron georreferenciados.</b><br>`
    + fila('EXACTA', '🎯') + fila('APROXIMADA', '📍') + fila('CENTROIDE MUNICIPAL', '🏘️')
    + (META.pendientes_revision_manual
        ? `<br>${META.pendientes_revision_manual} registro(s) sin poder ubicar — ver <code>imposibles_de_ubicar.xlsx</code>.`
        : '');
})();

// ---------------------------------------------------------------------
// Arranque
// ---------------------------------------------------------------------
pintarFiltroAnios();
pintarFiltroCapas();
reconstruirCapas();

</script>
